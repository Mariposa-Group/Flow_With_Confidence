<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow With Confidence - FYP</title>
    <style>
        /* Force page to remove default margins and fill screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        /* Make the Ruffle player expand to fill 100% of the screen */
        #player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <!-- This container fills the whole screen -->
    <div id="player"></div>

    <!-- Load Ruffle from CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "allowScriptAccess": true,
            // Scales your Flash project to fit the browser window nicely
            "letterbox": "fullscreen" 
        };

        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            
            container.appendChild(player);

            // Loads your exact file with proper web-safe spacing code
            player.load("flow%20with%20confidence%20%281%29.swf"); 
        });
    </script>
</body>
</html>
